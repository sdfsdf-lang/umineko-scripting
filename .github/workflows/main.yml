name: CI (Thai WH)

# Builds the Witch-Hunt (wh) script, which this fork translates to Thai,
# and publishes wh.file as a GitHub Release on every push to master.
# Run it by hand from the Actions tab with "Run workflow".

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WH (Thai) scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile
        run: |
          BUILD=$(($(git rev-list --count --first-parent HEAD)+3500))
          TODAY=$(date +"%d.%m.%y")
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "TODAY=${TODAY}" >> "$GITHUB_ENV"
          echo "Build number ${BUILD}"
          mkdir -p ciout
          LAST=$(<current/last)
          if [ "$LAST" == "" ]; then LAST=1; fi
          if [ -f current/last_en ]; then LAST_EN=$(<current/last_en); else LAST_EN="$LAST" ; fi
          php update-manager/update-manager.php dscript "ciout/wh.txt" . wh ${BUILD} || exit 1
          php update-manager/update-manager.php script ciout/wh.txt "ciout/wh.file" "$LAST_EN" || exit 1
          cd ciout
          zip -qry umineko-th-scripts_r${BUILD}.zip wh.file || exit 1
          zip -qry umineko-th-scripts_r${BUILD}_dev.zip wh.txt || exit 1
          cd ..
          {
            echo "Thai translation build r${BUILD} (${TODAY})"
            echo ""
            echo "Latest change: $(git show -s --format='%s')"
            echo ""
            echo "How to install: extract umineko-th-scripts_r${BUILD}.zip and copy wh.file into the game folder, replacing the old one (back it up first)."
          } > release_notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: umineko-th-scripts_r${{ env.BUILD }}
          path: |
            ciout/umineko-th-scripts_r${{ env.BUILD }}.zip
            ciout/umineko-th-scripts_r${{ env.BUILD }}_dev.zip

      - name: Release
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: th-r${{ env.BUILD }}
          name: Umineko Thai Scripts r${{ env.BUILD }}
          body_path: release_notes.md
          files: |
            ciout/umineko-th-scripts_r${{ env.BUILD }}.zip
            ciout/umineko-th-scripts_r${{ env.BUILD }}_dev.zip
